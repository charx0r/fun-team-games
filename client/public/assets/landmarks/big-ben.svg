<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="skyBB" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6B7280"/>
      <stop offset="1" stop-color="#9CA3AF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#skyBB)"/>
  <!-- ground -->
  <rect y="360" width="400" height="40" fill="#374151"/>
  <!-- tower base -->
  <rect x="160" y="280" width="80" height="80" fill="#A16207"/>
  <rect x="155" y="355" width="90" height="10" fill="#78350F"/>
  <!-- tower middle shaft with windows -->
  <rect x="170" y="170" width="60" height="110" fill="#B45309"/>
  <g fill="#1F2937">
    <rect x="180" y="185" width="12" height="18"/>
    <rect x="208" y="185" width="12" height="18"/>
    <rect x="180" y="215" width="12" height="18"/>
    <rect x="208" y="215" width="12" height="18"/>
    <rect x="180" y="245" width="12" height="18"/>
    <rect x="208" y="245" width="12" height="18"/>
  </g>
  <!-- clock face section -->
  <rect x="165" y="140" width="70" height="60" fill="#92400E"/>
  <!-- CLOCK -->
  <circle cx="200" cy="170" r="24" fill="#FEF3C7" stroke="#78350F" stroke-width="3"/>
  <!-- clock numerals as dots -->
  <g fill="#1F2937">
    <circle cx="200" cy="150" r="1.5"/>
    <circle cx="220" cy="170" r="1.5"/>
    <circle cx="200" cy="190" r="1.5"/>
    <circle cx="180" cy="170" r="1.5"/>
  </g>
  <!-- clock hands -->
  <line x1="200" y1="170" x2="200" y2="155" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="170" x2="215" y2="172" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="170" r="2" fill="#1F2937"/>
  <!-- ornate top -->
  <rect x="170" y="125" width="60" height="15" fill="#78350F"/>
  <polygon points="175,125 225,125 220,110 180,110" fill="#A16207"/>
  <!-- spire -->
  <polygon points="185,110 215,110 210,70 190,70" fill="#166534"/>
  <polygon points="190,70 210,70 200,30" fill="#15803D"/>
  <!-- flag/cross -->
  <rect x="199" y="20" width="2" height="15" fill="#1F2937"/>
  <circle cx="200" cy="20" r="3" fill="#EAB308"/>
  <!-- small windows on base -->
  <rect x="175" y="295" width="50" height="30" fill="#1F2937"/>
  <rect x="180" y="300" width="18" height="20" fill="#FEF3C7" opacity="0.4"/>
  <rect x="202" y="300" width="18" height="20" fill="#FEF3C7" opacity="0.4"/>
  <!-- side buildings (parliament) -->
  <rect x="60" y="300" width="90" height="60" fill="#7C2D12"/>
  <rect x="250" y="300" width="90" height="60" fill="#7C2D12"/>
  <g fill="#1F2937">
    <rect x="70" y="315" width="8" height="14"/>
    <rect x="85" y="315" width="8" height="14"/>
    <rect x="100" y="315" width="8" height="14"/>
    <rect x="115" y="315" width="8" height="14"/>
    <rect x="130" y="315" width="8" height="14"/>
    <rect x="260" y="315" width="8" height="14"/>
    <rect x="275" y="315" width="8" height="14"/>
    <rect x="290" y="315" width="8" height="14"/>
    <rect x="305" y="315" width="8" height="14"/>
    <rect x="320" y="315" width="8" height="14"/>
  </g>
</svg>
