<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="skyTM" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#skyTM)"/>
  <circle cx="330" cy="90" r="32" fill="#FED7AA" opacity="0.9"/>
  <!-- ground -->
  <rect y="320" width="400" height="80" fill="#15803D"/>
  <!-- reflecting pool -->
  <rect x="130" y="340" width="140" height="40" fill="#38BDF8"/>
  <rect x="130" y="340" width="140" height="4" fill="#0EA5E9"/>
  <!-- platform -->
  <rect x="80" y="290" width="240" height="30" fill="#E7E5E4"/>
  <!-- MINARET LEFT — MISSING (this is the edit) -->
  <!-- MINARET RIGHT (present) -->
  <g>
    <rect x="300" y="180" width="12" height="110" fill="#F3F4F6" stroke="#A8A29E"/>
    <rect x="297" y="225" width="18" height="4" fill="#A8A29E"/>
    <rect x="297" y="255" width="18" height="4" fill="#A8A29E"/>
    <circle cx="306" cy="175" r="8" fill="#F3F4F6" stroke="#A8A29E"/>
    <polygon points="304,167 308,167 306,150" fill="#D97706"/>
  </g>
  <!-- main mausoleum -->
  <rect x="140" y="200" width="120" height="90" fill="#F9FAFB" stroke="#D1D5DB"/>
  <!-- archway -->
  <path d="M180 290 L180 240 Q200 215 220 240 L220 290 Z" fill="#1F2937"/>
  <!-- side arches -->
  <path d="M150 280 L150 250 Q160 240 170 250 L170 280 Z" fill="#6B7280"/>
  <path d="M230 280 L230 250 Q240 240 250 250 L250 280 Z" fill="#6B7280"/>
  <!-- small domes on corners -->
  <circle cx="150" cy="200" r="8" fill="#F3F4F6" stroke="#A8A29E"/>
  <circle cx="250" cy="200" r="8" fill="#F3F4F6" stroke="#A8A29E"/>
  <!-- main dome -->
  <path d="M160 200 Q200 130 240 200 Z" fill="#F9FAFB" stroke="#D1D5DB"/>
  <circle cx="200" cy="200" r="38" fill="#F9FAFB"/>
  <rect x="155" y="198" width="90" height="6" fill="#D1D5DB"/>
  <!-- finial spire -->
  <rect x="197" y="130" width="6" height="15" fill="#D97706"/>
  <polygon points="196,130 204,130 200,115" fill="#D97706"/>
  <circle cx="200" cy="115" r="3" fill="#EAB308"/>
</svg>
