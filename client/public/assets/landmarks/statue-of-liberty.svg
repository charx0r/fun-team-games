<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky2)"/>
  <!-- water -->
  <rect y="330" width="400" height="70" fill="#1D4ED8"/>
  <path d="M0 335 Q50 328 100 335 T200 335 T300 335 T400 335 L400 345 L0 345 Z" fill="#2563EB"/>
  <path d="M0 360 Q60 354 120 360 T240 360 T360 360 L400 360 L400 380 L0 380 Z" fill="#1E40AF"/>
  <!-- pedestal -->
  <rect x="160" y="260" width="80" height="70" fill="#A8A29E"/>
  <rect x="150" y="310" width="100" height="20" fill="#78716C"/>
  <!-- body -->
  <path d="M180 160 L170 260 L230 260 L220 160 Z" fill="#6EE7B7"/>
  <!-- robe folds -->
  <line x1="195" y1="180" x2="190" y2="255" stroke="#10B981" stroke-width="2"/>
  <line x1="205" y1="180" x2="210" y2="255" stroke="#10B981" stroke-width="2"/>
  <!-- arm raised with torch -->
  <rect x="225" y="90" width="10" height="80" fill="#6EE7B7" transform="rotate(10 230 130)"/>
  <!-- torch -->
  <rect x="228" y="70" width="14" height="25" fill="#FCD34D"/>
  <path d="M235 40 Q225 60 235 70 Q245 60 235 40 Z" fill="#F59E0B"/>
  <path d="M235 30 Q228 55 235 65 Q242 55 235 30 Z" fill="#FBBF24"/>
  <!-- head -->
  <circle cx="200" cy="145" r="22" fill="#6EE7B7"/>
  <!-- crown spikes -->
  <g fill="#10B981">
    <polygon points="200,110 198,125 202,125"/>
    <polygon points="185,115 188,128 192,126"/>
    <polygon points="215,115 212,128 208,126"/>
    <polygon points="175,125 180,135 184,132"/>
    <polygon points="225,125 220,135 216,132"/>
  </g>
  <!-- face -->
  <circle cx="194" cy="144" r="1.5" fill="#064E3B"/>
  <circle cx="206" cy="144" r="1.5" fill="#064E3B"/>
  <!-- tablet in left hand -->
  <rect x="160" y="195" width="22" height="30" fill="#D6D3D1" stroke="#78716C"/>
  <!-- sun -->
  <circle cx="70" cy="80" r="25" fill="#FEF3C7" opacity="0.8"/>
</svg>
