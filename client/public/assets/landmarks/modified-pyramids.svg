<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="skyPY" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#skyPY)"/>
  <circle cx="80" cy="90" r="34" fill="#FEF3C7" opacity="0.9"/>
  <!-- desert -->
  <path d="M0 300 Q100 280 200 300 Q300 280 400 300 L400 400 L0 400 Z" fill="#F59E0B"/>
  <path d="M0 340 Q120 325 240 345 Q320 335 400 340 L400 400 L0 400 Z" fill="#D97706"/>
  <!-- pyramid (back right) -->
  <polygon points="260,290 320,180 380,290" fill="#D97706"/>
  <polygon points="320,180 380,290 320,290" fill="#B45309"/>
  <!-- pyramid (middle large) -->
  <polygon points="150,290 230,130 310,290" fill="#F59E0B"/>
  <polygon points="230,130 310,290 230,290" fill="#D97706"/>
  <!-- pyramid (front left) -->
  <polygon points="50,300 130,195 210,300" fill="#FCD34D"/>
  <polygon points="130,195 210,300 130,300" fill="#F59E0B"/>
  <!-- EXTRA PYRAMID (the edit — 4th pyramid far right) -->
  <polygon points="330,305 360,255 390,305" fill="#FCD34D"/>
  <polygon points="360,255 390,305 360,305" fill="#F59E0B"/>
  <!-- sphinx (small) -->
  <g transform="translate(80,280)">
    <ellipse cx="20" cy="20" rx="25" ry="8" fill="#B45309"/>
    <rect x="10" y="10" width="20" height="14" fill="#D97706"/>
    <circle cx="15" cy="8" r="5" fill="#D97706"/>
    <polygon points="11,5 11,0 13,3" fill="#D97706"/>
    <polygon points="18,5 18,0 16,3" fill="#D97706"/>
  </g>
  <!-- palm tree -->
  <g transform="translate(330,320)">
    <rect x="-2" y="-20" width="4" height="30" fill="#78350F"/>
    <path d="M0 -20 Q-15 -30 -25 -20" stroke="#16A34A" stroke-width="3" fill="none"/>
    <path d="M0 -20 Q15 -30 25 -20" stroke="#16A34A" stroke-width="3" fill="none"/>
    <path d="M0 -20 Q-10 -40 -20 -40" stroke="#16A34A" stroke-width="3" fill="none"/>
    <path d="M0 -20 Q10 -40 20 -40" stroke="#16A34A" stroke-width="3" fill="none"/>
  </g>
</svg>
