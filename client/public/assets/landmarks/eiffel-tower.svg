<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky1)"/>
  <!-- distant hills -->
  <path d="M0 340 Q80 300 160 330 Q240 300 320 325 Q380 340 400 335 L400 400 L0 400 Z" fill="#92400E"/>
  <path d="M0 360 Q100 340 200 358 Q300 345 400 360 L400 400 L0 400 Z" fill="#78350F"/>
  <!-- tower -->
  <g stroke="#1F2937" stroke-width="2">
    <!-- legs -->
    <path d="M120 340 L180 220 L220 220 L280 340 L260 340 L220 240 L180 240 L140 340 Z" fill="#78350F"/>
    <!-- arch -->
    <path d="M150 310 Q200 250 250 310 Z" fill="#F59E0B"/>
    <!-- lower platform -->
    <rect x="165" y="215" width="70" height="10" fill="#78350F"/>
    <!-- mid section -->
    <path d="M180 215 L195 130 L205 130 L220 215 Z" fill="#78350F"/>
    <rect x="188" y="128" width="24" height="7" fill="#78350F"/>
    <!-- spire -->
    <path d="M195 128 L200 60 L205 128 Z" fill="#78350F"/>
    <path d="M197 60 L200 40 L203 60 Z" fill="#B91C1C"/>
    <!-- cross beams -->
    <line x1="165" y1="260" x2="235" y2="260"/>
    <line x1="175" y1="290" x2="225" y2="290"/>
    <line x1="188" y1="175" x2="212" y2="175"/>
    <line x1="184" y1="200" x2="216" y2="200"/>
    <line x1="192" y1="100" x2="208" y2="100"/>
  </g>
  <circle cx="320" cy="90" r="30" fill="#FBBF24" opacity="0.8"/>
  <!-- clouds -->
  <ellipse cx="80" cy="80" rx="30" ry="10" fill="#FFFBEB" opacity="0.8"/>
  <ellipse cx="340" cy="170" rx="40" ry="12" fill="#FFFBEB" opacity="0.8"/>
</svg>
