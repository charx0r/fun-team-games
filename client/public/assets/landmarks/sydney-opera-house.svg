  <g fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5">
    <path d="M70 260 Q100 150 180 260 Z"/>
    <path d="M120 260 Q170 120 240 260 Z"/>
    <path d="M180 260 Q230 140 290 260 Z"/>
    <path d="M240 260 Q280 170 330 260 Z"/>
  </g>
  <!-- shell lines -->
