<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FCA5A5"/>
      <stop offset="1" stop-color="#FDE68A"/>
