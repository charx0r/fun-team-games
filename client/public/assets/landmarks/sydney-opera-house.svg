  </defs>
  <rect width="400" height="400" fill="url(#sky3)"/>
  <circle cx="80" cy="100" r="35" fill="#F59E0B" opacity="0.9"/>
  <!-- water -->
  <rect y="280" width="400" height="120" fill="#0369A1"/>
  <g stroke="#38BDF8" stroke-width="1" fill="none">
    <path d="M0 300 Q40 295 80 300 T160 300 T240 300 T320 300 T400 300"/>
    <path d="M0 320 Q40 315 80 320 T160 320 T240 320 T320 320 T400 320"/>
    <path d="M0 345 Q40 340 80 345 T160 345 T240 345 T320 345 T400 345"/>
  </g>
  <!-- platform -->
