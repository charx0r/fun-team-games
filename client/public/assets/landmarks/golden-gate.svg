<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="skyGG" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#skyGG)"/>
  <!-- fog -->
  <ellipse cx="200" cy="230" rx="220" ry="20" fill="#FDE68A" opacity="0.6"/>
  <!-- hills -->
  <path d="M0 280 Q60 220 130 270 Q160 230 200 265 Q240 230 270 270 Q340 220 400 280 L400 400 L0 400 Z" fill="#84763C"/>
  <path d="M0 320 Q100 280 180 310 Q260 280 400 320 L400 400 L0 400 Z" fill="#65A30D"/>
  <!-- water -->
  <rect y="290" width="400" height="120" fill="#1E3A8A" opacity="0.0"/>
  <!-- bridge towers (Int'l Orange) -->
  <g fill="#DC2626">
    <rect x="90" y="100" width="20" height="220"/>
    <rect x="290" y="100" width="20" height="220"/>
    <!-- cross beams -->
    <rect x="85" y="140" width="30" height="8"/>
    <rect x="85" y="180" width="30" height="8"/>
    <rect x="85" y="220" width="30" height="8"/>
    <rect x="285" y="140" width="30" height="8"/>
    <rect x="285" y="180" width="30" height="8"/>
    <rect x="285" y="220" width="30" height="8"/>
    <!-- caps -->
    <rect x="83" y="94" width="34" height="8"/>
    <rect x="283" y="94" width="34" height="8"/>
  </g>
  <!-- main suspension cables -->
  <path d="M0 240 Q100 80 200 240 Q300 80 400 240" stroke="#B91C1C" stroke-width="3" fill="none"/>
  <!-- secondary cables -->
  <path d="M0 270 Q100 110 200 270 Q300 110 400 270" stroke="#DC2626" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- deck -->
  <rect x="0" y="235" width="400" height="10" fill="#991B1B"/>
  <rect x="0" y="245" width="400" height="4" fill="#7F1D1D"/>
  <!-- vertical cables -->
  <g stroke="#B91C1C" stroke-width="1">
    <line x1="20" y1="235" x2="20" y2="258"/>
    <line x1="40" y1="235" x2="40" y2="252"/>
    <line x1="60" y1="235" x2="60" y2="245"/>
    <line x1="140" y1="235" x2="140" y2="250"/>
    <line x1="170" y1="235" x2="170" y2="258"/>
    <line x1="230" y1="235" x2="230" y2="255"/>
    <line x1="260" y1="235" x2="260" y2="248"/>
    <line x1="340" y1="235" x2="340" y2="245"/>
    <line x1="360" y1="235" x2="360" y2="255"/>
    <line x1="380" y1="235" x2="380" y2="260"/>
  </g>
</svg>
